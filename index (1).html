<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>छठ महापर्व – सूर्य देव की पावन यात्रा | Chhath Mahaparv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700;800&family=Yatra+One&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#2a0f05;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;image-rendering:auto;box-shadow:0 0 40px rgba(0,0,0,.6)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ---- core.js ----
// ================= CORE: canvas, input, i18n, save, utils =================
'use strict';
const W = 960, H = 540, GY = 452; // logical size, ground line
const cv = document.getElementById('game');
let ctx = cv.getContext('2d');
function swapCtx(c) { ctx = c; }
let SCALE = 1, OX = 0, OY = 0, DPR = 1;
const FONT = "'Noto Sans Devanagari','Kalam','Nirmala UI','Mangal','Kohinoor Devanagari',system-ui,sans-serif";
const TFONT = "'Yatra One','Noto Sans Devanagari','Nirmala UI','Mangal',serif";

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const vw = window.innerWidth, vh = window.innerHeight;
  SCALE = Math.min(vw / W, vh / H);
  cv.style.width = (W * SCALE) + 'px';
  cv.style.height = (H * SCALE) + 'px';
  cv.width = Math.round(W * SCALE * DPR);
  cv.height = Math.round(H * SCALE * DPR);
  const r = cv.getBoundingClientRect(); OX = r.left; OY = r.top;
}
window.addEventListener('resize', resize);

// ---------- utils ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function seeded(s) { return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
function lerpCol(a, b, t) {
  const pa = hex(a), pb = hex(b);
  return `rgb(${Math.round(lerp(pa[0], pb[0], t))},${Math.round(lerp(pa[1], pb[1], t))},${Math.round(lerp(pa[2], pb[2], t))})`;
}
function hex(c) { if (c[0] !== '#') { const m = c.match(/\d+/g); return [+m[0], +m[1], +m[2]]; } const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const inRect = (x, y, r) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

// ---------- save ----------
const SAVE_KEY = 'chhath_mahaparv_v1';
const DEF = { lang: 'hi', music: true, sfx: true, vol: 0.8, track: -1, narr: true, hero: 'aarav', unlocked: 1, done: {}, art: [], memories: [], book: false, family: false, ghat: [], stars: {} };
let S = Object.assign({}, DEF);
let PHOTOS = [];
function load() {
  try { const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (d) S = Object.assign({}, DEF, d); } catch (e) { }
  try { PHOTOS = JSON.parse(localStorage.getItem(SAVE_KEY + '_ph') || '[]'); } catch (e) { PHOTOS = []; }
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { }
}
function savePhotos() { try { localStorage.setItem(SAVE_KEY + '_ph', JSON.stringify(PHOTOS.slice(-8))); } catch (e) { } }

// ---------- i18n ----------
const L = o => (o && typeof o === 'object') ? (o[S.lang] || o.en) : o;
const B = (hi, en) => ({ hi, en });

// ---------- text ----------
function txt(s, x, y, size = 20, col = '#3b1d0b', align = 'left', font = FONT, weight = '600') {
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillText(s, x, y);
}
function txtO(s, x, y, size, col, out = '#3b1d0b', align = 'center', font = TFONT, lw = 4) {
  ctx.font = `600 ${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.strokeStyle = out; ctx.lineWidth = lw; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function wrap(s, x, y, maxW, size = 18, col = '#3b1d0b', lh = 1.4, align = 'left', weight = '500') {
  ctx.font = `${weight} ${size}px ${FONT}`;
  const words = String(s).split(' '); let line = '', yy = y; const lines = [];
  for (const w of words) { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line);
  for (const l of lines) { txt(l, x, yy, size, col, align, FONT, weight); yy += size * lh; }
  return yy;
}
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }

// ---------- input ----------
const keys = {}, pressed = {};
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
let touchUI = IS_TOUCH;
window.addEventListener('keydown', e => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (!keys[k]) pressed[k] = true; keys[k] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  Audio2.unlock();
  if (scene && scene.key) scene.key(k);
});
window.addEventListener('keyup', e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key; keys[k] = false; });
const pointers = {}; // id -> {x,y}
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / SCALE, y: (e.clientY - r.top) / SCALE }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); Audio2.unlock(); const p = toLogical(e); pointers[e.pointerId] = p;
  if (e.pointerType === 'touch') touchUI = true;
  try { cv.setPointerCapture(e.pointerId); } catch (_) { }
  if (scene && scene.down) scene.down(p.x, p.y, e.pointerId);
});
cv.addEventListener('pointermove', e => { const p = toLogical(e); if (pointers[e.pointerId]) pointers[e.pointerId] = p; MOUSE.x = p.x; MOUSE.y = p.y; if (scene && scene.move) scene.move(p.x, p.y, e.pointerId); });
const upH = e => { const p = toLogical(e); delete pointers[e.pointerId]; if (scene && scene.up) scene.up(p.x, p.y, e.pointerId); };
cv.addEventListener('pointerup', upH); cv.addEventListener('pointercancel', upH);
cv.addEventListener('contextmenu', e => e.preventDefault());
const MOUSE = { x: 0, y: 0 };

// ---------- scene manager with fade ----------
let scene = null, fade = 0, fadeDir = 0, nextScene = null;
function go(s) { if (!s) return; if (!scene) { scene = s; s.enter && s.enter(); return; } nextScene = s; fadeDir = 1; }

// ---------- generic button ----------
function button(r, label, opts = {}) {
  const hov = inRect(MOUSE.x, MOUSE.y, r) && !touchUI;
  ctx.save();
  ctx.shadowColor = 'rgba(80,30,0,.35)'; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  rrect(r.x, r.y, r.w, r.h, r.r || 14);
  const g = ctx.createLinearGradient(0, r.y, 0, r.y + r.h);
  const c1 = opts.c1 || (hov ? '#ffe27a' : '#ffd24a'), c2 = opts.c2 || (hov ? '#f39c12' : '#e67e22');
  g.addColorStop(0, opts.disabled ? '#ccc' : c1); g.addColorStop(1, opts.disabled ? '#999' : c2);
  ctx.fillStyle = g; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 3; ctx.strokeStyle = '#7a2e0b'; ctx.stroke();
  // inner dotted madhubani line
  ctx.setLineDash([2, 5]); ctx.lineWidth = 2; ctx.strokeStyle = '#a3001b';
  rrect(r.x + 5, r.y + 5, r.w - 10, r.h - 10, (r.r || 14) - 4); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  if (opts.sub) { txt(label, r.x + r.w / 2, r.y + r.h / 2 - 8, opts.size || 20, '#4a1405', 'center', FONT, '700'); txt(opts.sub, r.x + r.w / 2, r.y + r.h / 2 + 13, 13, '#6b2a0a', 'center'); }
  else txt(label, r.x + r.w / 2, r.y + r.h / 2 + 1, opts.size || 20, '#4a1405', 'center', FONT, '700');
}

// ---- audio.js ----
// ================= AUDIO: procedural Indian devotional soundscape (all original) =================
const Audio2 = (() => {
  let ac = null, master, musicG, sfxG, ambG, noiseBuf, unlocked = false;
  let curTrack = -1, nextT = 0, step = 0, droneNodes = [], schedTimer = null;
  const amb = { river: null, crowd: null, wind: null }, ambLv = { river: 0, crowd: 0, wind: 0, birds: 0 };
  let birdT = 0;

  const TRACKS = [
    { name: B('गाँव की सुबह', 'Village Morning'), bpm: 84, root: 261.6, scale: [0, 2, 4, 7, 9], tal: 'keherwa', seed: 11, bells: 0, manj: .5 },
    { name: B('रसोई की महक', 'Kitchen Aroma'), bpm: 96, root: 277.2, scale: [0, 2, 4, 5, 7, 9, 10], tal: 'dadra', seed: 23, bells: 0, manj: .4 },
    { name: B('संध्या धुन', 'Sandhya Dhun'), bpm: 64, root: 246.9, scale: [0, 2, 4, 6, 7, 9, 11], tal: 'slow', seed: 37, bells: 1, manj: .2 },
    { name: B('उषा राग', 'Usha Raag'), bpm: 58, root: 261.6, scale: [0, 1, 4, 5, 7, 8, 11], tal: 'slow', seed: 41, bells: 1, manj: .15 },
    { name: B('महापर्व उत्सव', 'Mahaparv Utsav'), bpm: 120, root: 293.7, scale: [0, 2, 4, 5, 7, 9, 11], tal: 'keherwa', seed: 53, bells: 0, manj: 1 },
    { name: B('घाट की लहर', 'Waves of the Ghat'), bpm: 72, root: 220, scale: [0, 2, 3, 7, 9], tal: 'dadra', seed: 67, bells: 1, manj: .3 },
  ];
  const TALS = {
    keherwa: ['dha', 'ge', 'na', 'ti', 'na', 'ka', 'dhi', 'na'],
    dadra: ['dha', 'dhi', 'na', 'dha', 'ti', 'na'],
    slow: ['dha', '', 'na', '', 'ti', '', 'na', '']
  };
  const melodies = {};
  function makeMelody(t) {
    const r = seeded(t.seed * 977), n = t.scale.length, out = [];
    // 4 phrases; each phrase = list of [degree(octave-aware), beats]
    const motifs = [];
    for (let m = 0; m < 2; m++) { const mot = []; let d = Math.floor(r() * n); for (let i = 0; i < 4; i++) { d += Math.floor(r() * 3) - 1; mot.push(d); } motifs.push(mot); }
    for (let p = 0; p < 4; p++) {
      const ph = []; let d = p % 2 ? n : Math.floor(n / 2);
      const mot = motifs[p % 2];
      for (let i = 0; i < 4; i++) ph.push([mot[i] + (p === 2 ? 2 : 0), r() < .3 ? 2 : 1]);
      for (let i = 0; i < 3; i++) { d += Math.floor(r() * 3) - 1; d = clamp(d, 0, n * 2 - 1); ph.push([d, r() < .25 ? .5 : 1]); if (ph[ph.length - 1][1] === .5) ph.push([d + 1, .5]); }
      ph.push([p === 3 ? 0 : (p === 1 ? n : 2), p === 3 ? 4 : 2]); // resolve
      ph.push([null, 1]);
      out.push(...ph);
    }
    return out;
  }
  function freqOf(t, deg) { const n = t.scale.length; const oct = Math.floor(deg / n), i = ((deg % n) + n) % n; return t.root * Math.pow(2, oct + t.scale[i] / 12); }

  function init() {
    if (ac) return;
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ac.createGain(); master.connect(ac.destination);
    musicG = ac.createGain(); musicG.connect(master);
    sfxG = ac.createGain(); sfxG.connect(master);
    ambG = ac.createGain(); ambG.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // reverb-ish convolver
    applyVol();
    schedTimer = setInterval(tick, 40);
  }
  function applyVol() {
    if (!ac) return;
    master.gain.value = S.vol;
    musicG.gain.setTargetAtTime(S.music ? .55 : 0, ac.currentTime, .2);
    sfxG.gain.setTargetAtTime(S.sfx ? .8 : 0, ac.currentTime, .05);
    ambG.gain.setTargetAtTime(S.sfx ? .5 : 0, ac.currentTime, .2);
  }
  function unlock() {
    init(); if (!ac) return;
    if (ac.state === 'suspended') ac.resume();
    if (!unlocked) { unlocked = true; if (pendingTrack >= 0) play(pendingTrack); applyAmb(); }
  }
  let pendingTrack = -1;

  // ---------- instruments ----------
  function env(g, t, a, peak, dec, sus = 0.0001) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(Math.max(sus, 0.0001), t + a + dec); }
  function bansuri(f, t, dur, vol = .22) {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = f; o2.frequency.value = f * 2;
    const g2 = ac.createGain(); g2.gain.value = .12;
    const vib = ac.createOscillator(), vg = ac.createGain(); vib.frequency.value = 5.2; vg.gain.setValueAtTime(0, t); vg.gain.linearRampToValueAtTime(f * .012, t + Math.min(dur, .6));
    vib.connect(vg); vg.connect(o.frequency); vg.connect(o2.frequency);
    // slight glide in (meend)
    o.frequency.setValueAtTime(f * .985, t); o.frequency.exponentialRampToValueAtTime(f, t + .08);
    lp.type = 'lowpass'; lp.frequency.value = 2600;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(musicG);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .07); g.gain.setValueAtTime(vol, t + dur * .7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + .25);
    // breath
    const n = ac.createBufferSource(), bp = ac.createBiquadFilter(), ng = ac.createGain(); n.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = f * 2; bp.Q.value = 4;
    ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(vol * .25, t + .04); ng.gain.exponentialRampToValueAtTime(0.0001, t + .25);
    n.connect(bp); bp.connect(ng); ng.connect(musicG);
    [o, o2, vib].forEach(x => { x.start(t); x.stop(t + dur + .3); }); n.start(t); n.stop(t + .3);
  }
  function tabla(bol, t, vol = 1) {
    if (!bol) return;
    const bass = bol.startsWith('dh') || bol === 'ge';
    if (bass) { // bayan
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
      o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(70, t + .25);
      env(g, t, .005, .5 * vol, .35); o.connect(g); g.connect(musicG); o.start(t); o.stop(t + .45);
    }
    if (bol !== 'ge') { // dayan
      const f = bol === 'ti' ? 760 : 520;
      [1, 1.5, 2.02].forEach((m, i) => {
        const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f * m;
        env(g, t, .003, (.22 / (i + 1)) * vol, bol === 'ka' ? .05 : .22); o.connect(g); g.connect(musicG); o.start(t); o.stop(t + .3);
      });
      const n = ac.createBufferSource(), hp = ac.createBiquadFilter(), ng = ac.createGain(); n.buffer = noiseBuf; hp.type = 'highpass'; hp.frequency.value = 2500;
      env(ng, t, .002, .12 * vol, .03); n.connect(hp); hp.connect(ng); ng.connect(musicG); n.start(t, Math.random()); n.stop(t + .06);
    }
  }
  function manjira(t, vol = .1) {
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 5000; const g = ac.createGain(); env(g, t, .002, vol, .6);
    hp.connect(g); g.connect(musicG);
    [3150, 4270, 5340, 6680].forEach(f => { const o = ac.createOscillator(); o.type = 'square'; o.frequency.value = f; o.connect(hp); o.start(t); o.stop(t + .7); });
  }
  function bell(t, f = 880, vol = .15, out) {
    [1, 2.76, 5.4, 8.93].forEach((m, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = f * m; env(g, t, .002, vol / (i + 1.3), 2.2 / (i + 1)); o.connect(g); g.connect(out || musicG); o.start(t); o.stop(t + 2.5); });
  }
  function startDrone(tr) {
    stopDrone();
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 1;
    const g = ac.createGain(); g.gain.value = 0; g.gain.setTargetAtTime(.05, ac.currentTime, 1.5);
    lp.connect(g); g.connect(musicG);
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .15; lg.gain.value = 250; lfo.connect(lg); lg.connect(lp.frequency); lfo.start();
    const fs = [tr.root / 2, tr.root / 2 * 1.5, tr.root, tr.root / 4];
    const os = fs.map((f, i) => { const o = ac.createOscillator(); o.type = i === 3 ? 'triangle' : 'sawtooth'; o.frequency.value = f; o.detune.value = (i - 1.5) * 4; o.connect(lp); o.start(); return o; });
    droneNodes = [...os, lfo, g];
  }
  function stopDrone() {
    droneNodes.forEach(n => { try { if (n.gain) { n.gain.setTargetAtTime(0, ac.currentTime, .3); } else n.stop(ac.currentTime + 1.2); } catch (e) { } });
    droneNodes = [];
  }
  let melIdx = 0, melBeat = 0;
  function play(i) {
    if (S.track >= 0 && i >= 0 && !forceTrack) i = S.track;
    pendingTrack = i;
    if (!ac || !unlocked) return;
    if (i === curTrack) return;
    curTrack = i; if (i < 0) { stopDrone(); return; }
    const tr = TRACKS[i]; if (!melodies[i]) melodies[i] = makeMelody(tr);
    startDrone(tr); nextT = ac.currentTime + .3; step = 0; melIdx = 0; melBeat = 0;
  }
  let forceTrack = false;
  function playForce(i) { forceTrack = true; curTrack = -2; play(i); forceTrack = false; }
  function tick() {
    if (!ac || curTrack < 0) { ambTick(); return; }
    const tr = TRACKS[curTrack], spb = 60 / tr.bpm / 2; // eighth-note steps
    const tal = TALS[tr.tal], mel = melodies[curTrack];
    while (nextT < ac.currentTime + .15) {
      const t = nextT;
      if (S.music) {
        tabla(tal[step % tal.length], t, tr.tal === 'slow' ? .6 : .85);
        if (tr.manj && step % 4 === 0 && Math.random() < tr.manj) manjira(t, .05 + tr.manj * .05);
        if (tr.bells && step % 32 === 0) bell(t, tr.root * 2, .1);
        // melody: beat units = 2 steps
        if (melBeat <= 0) {
          const [deg, beats] = mel[melIdx % mel.length]; melIdx++;
          const dur = beats * spb * 2;
          if (deg !== null) bansuri(freqOf(tr, deg + tr.scale.length), t, dur * .95, .16);
          melBeat = beats * 2;
        }
      }
      melBeat--; step++; nextT += spb;
    }
    ambTick();
  }
  // ---------- ambience ----------
  function loopNoise(type, f, q) {
    const n = ac.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const fl = ac.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ac.createGain(); g.gain.value = 0; n.connect(fl); fl.connect(g); g.connect(ambG); n.start();
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = .2 + Math.random() * .2; lg.gain.value = f * .3; lfo.connect(lg); lg.connect(fl.frequency); lfo.start();
    return g;
  }
  function applyAmb() {
    if (!ac || !unlocked) return;
    if (!amb.river) { amb.river = loopNoise('lowpass', 450, 1); amb.crowd = loopNoise('bandpass', 700, .7); amb.wind = loopNoise('bandpass', 300, .5); }
    amb.river.gain.setTargetAtTime(ambLv.river * .5, ac.currentTime, .8);
    amb.crowd.gain.setTargetAtTime(ambLv.crowd * .12, ac.currentTime, .8);
    amb.wind.gain.setTargetAtTime(ambLv.wind * .35, ac.currentTime, .8);
  }
  function setAmb(o) { Object.assign(ambLv, { river: 0, crowd: 0, wind: 0, birds: 0 }, o); applyAmb(); }
  function ambTick() {
    if (!ac || !unlocked || !S.sfx) return;
    if (ambLv.birds > 0 && ac.currentTime > birdT) { birdT = ac.currentTime + rand(1.2, 4) / ambLv.birds; chirp(); }
  }
  function chirp() {
    const t = ac.currentTime + .05, n = 2 + Math.floor(Math.random() * 4), base = rand(2200, 3800);
    for (let i = 0; i < n; i++) {
      const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine';
      const s = t + i * rand(.08, .14); o.frequency.setValueAtTime(base, s); o.frequency.exponentialRampToValueAtTime(base * rand(1.2, 1.6), s + .06);
      env(g, s, .005, .05, .07); o.connect(g); g.connect(ambG); o.start(s); o.stop(s + .12);
    }
  }
  // ---------- sfx ----------

// ---------- Madhubani frame ----------
function frame(x, y, w, h, bg = '#fff3d6') {
  ctx.save();
  ctx.shadowColor = 'rgba(60,20,0,.4)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 4;
  rrect(x, y, w, h, 18); ctx.fillStyle = bg; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.lineWidth = 4; ctx.strokeStyle = C.ink; ctx.stroke();
  rrect(x + 8, y + 8, w - 16, h - 16, 12); ctx.lineWidth = 2; ctx.strokeStyle = C.red; ctx.stroke();
  // zigzag band
  ctx.beginPath(); ctx.strokeStyle = C.tur; ctx.lineWidth = 2;
  for (let k = x + 20; k < x + w - 20; k += 12) { ctx.moveTo(k, y + 14); ctx.lineTo(k + 6, y + 20); ctx.lineTo(k + 12, y + 14); ctx.moveTo(k, y + h - 14); ctx.lineTo(k + 6, y + h - 20); ctx.lineTo(k + 12, y + h - 14); }
  ctx.stroke();
  // corner suns
  [[x + 14, y + 14], [x + w - 14, y + 14], [x + 14, y + h - 14], [x + w - 14, y + h - 14]].forEach(([a, b]) => { circ(a, b, 9); fillInk(C.tur, 2); circ(a, b, 4); fillInk(C.red, 1); });
  ctx.restore();
}

// ================= WORLD: side-scrolling level gameplay =================
function mkPlayer(hero, x, p2 = false) { return { hero, x, y: GY, vx: 0, vy: 0, on: true, dir: 1, ph: 0, p2, stepT: 0 }; }

function World(idx) {
  const lv = LEVELS[idx];
  const w = {
    got: {}, talked: new Set(), escDone: {}, carry: null, goals: lv.goals, lv,
    findItem: id => { const it = items.find(i => !i.taken && i.id === id); return it ? it.x : null; },
    findNpc: () => { const n = npcs.find(n => !w.talked.has(n.who)); return n ? n.x : null; },
    findSpot: k => { const s = spots.find(s => !s.done && s.kind === k); return s ? s.x : null; },
    findEsc: who => { const n = npcs.find(n => n.who === who); if (!n) return null; return n.follow ? n.target : n.x; },
    spotDone: k => spots.filter(s => s.kind === k && s.done).length
  };
  const items = lv.items.map(([id, x, y]) => ({ id, x, y: y || GY - 34, taken: false, ph: Math.random() * 6 }));
  const npcs = lv.npcs.map(n => Object.assign({ ph: 0, dir: -1, follow: false, home: n.x }, n));
  const SPOT_L = { sweep: B('झाड़ू लगाएँ', 'Sweep'), arrange: B('बर्तन सजाएँ', 'Arrange pots'), decor: B('माला लगाएँ', 'Hang garland'), cane: B('ईख लगाएँ', 'Place sugarcane'), diya: B('दीया जलाएँ', 'Light diya') };
  const spots = lv.spots.map(s => Object.assign({ done: false, anim: 0, label: SPOT_L[s.kind] }, s));
  const other = S.hero === 'aarav' ? 'aarya' : 'aarav';
  const players = [mkPlayer(S.hero, 100)];
  if (S.family) players.push(mkPlayer(other, 50, true));
  const pk = { x: 60, y: GY - 160, dir: 1, tx: 0, ty: 0 };
  let t = 0, cam = 0, dialog = null, overlay = null, mini = null, gateOpen = false, finished = false;
  let touchJump = false;
  let toasts = [], parts = [], hint = { t: 0, x: null }, idleHint = 12, photoFlash = 0, touchBtns = [];
  const goalDone = g => g.n(w) >= g.of;
  const allDone = () => lv.goals.every(goalDone);
  const progress = () => lv.goals.reduce((a, g) => a + Math.min(1, g.n(w) / g.of), 0) / lv.goals.length;
  const gateX = lv.width - 110;

  function toast(s, col = '#fff') { toasts.push({ s: L(s), t: 2.6, col }); }
  function burst(x, y, col = '#ffd23f', n = 14, kind = 'spark') { for (let i = 0; i < n; i++) parts.push({ x, y, vx: rand(-120, 120), vy: rand(-200, -40), life: rand(.6, 1.2), col, kind }); }
  function speak(s) { narrate(L(s)); }

  let entered = false;
  function enter() {
    Audio2.play(lv.track); Audio2.setAmb(lv.amb || {});
    if (entered) return; entered = true;
    toast(L(lv.title) + ' — ' + L(lv.sub), '#ffe27a');
    setTimeout(() => { if (scene === self && !dialog) say(PEOPLE.aarav, [B('सूर्य पंखी: मैं तुम्हारे साथ हूँ! कोई मुश्किल हो तो H दबाओ या मुझ पर टैप करो।', 'Surya Pankhi: I\'m with you! Press H or tap me for a hint.')], 'pankhi'); }, 900);
  }
  function say(who, lines, portrait) { dialog = { who, lines, i: 0, ch: 0, portrait }; }

  function interactTarget(p) {
    let best = null, bd = 70;
    for (const n of npcs) { if (n.follow) continue; const d = Math.abs(n.x - p.x); if (d < bd) { bd = d; best = { type: 'npc', o: n }; } }
    for (const s of spots) { if (s.done) continue; if (s.kind === 'pickup' && w.carry) continue; const d = Math.abs(s.x - p.x); if (d < bd) { bd = d; best = { type: 'spot', o: s }; } }
    if (gateOpen && Math.abs(gateX - p.x) < 90) best = { type: 'gate' };
    if (!best) for (const n of npcs) if (n.follow && Math.abs(n.x - p.x) < 70) best = { type: 'npc', o: n };
    return best;
  }
  function interact(p) {
    const tg = interactTarget(p); if (!tg) return;
    if (tg.type === 'npc') {
      const n = tg.o; const first = !w.talked.has(n.who); w.talked.add(n.who);
      if (n.esc && !n.follow && !w.escDone[n.who]) { n.follow = true; toast(B('साथ चल रहे हैं — घाट तक ले चलें!', 'Walking together — lead the way to the ghat!'), '#aef'); }
      say(PEOPLE[n.who], n.follow && !first && n.escLines ? n.escLines : n.lines);
      if (n.who === 'dadi' || n.who === 'pandit') speak(n.lines[0]);
      if (first) Audio2.sfx('talk');
    } else if (tg.type === 'spot') useSpot(tg.o);
    else if (tg.type === 'gate') finish();
  }

// ---------- narration (Web Speech, optional) ----------
function narrate(text) {
  if (!S.narr) return;
  try {
    const sp = window.speechSynthesis; if (!sp) return; sp.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/सूर्य पंखी:|Surya Pankhi:/g, ''));
    u.lang = S.lang === 'hi' ? 'hi-IN' : 'en-IN'; u.rate = .92; u.pitch = 1.05;
    const v = sp.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(S.lang === 'hi' ? 'hi' : 'en-in')); if (v) u.voice = v;
    sp.speak(u);
  } catch (e) { }
}

  // ---------- 4. Match fruits & offerings (memory) ----------
  match(arg, onDone, standalone) {
    const m = MiniShell(B('फल और प्रसाद की जोड़ी', 'Match Fruits & Offerings'), B('दो पत्ते पलटें और एक जैसे प्रसाद की जोड़ी बनाएँ', 'Flip two cards and find matching offerings'), standalone, onDone);
    const ids = ['thekua', 'banana', 'coconut', 'sugarcane', 'lemon', 'diya'];
    const cards = shuffle([...ids, ...ids]).map((id, i) => ({ id, x: 190 + (i % 4) * 150, y: 150 + Math.floor(i / 4) * 125, f: 0, open: false, done: false }));
    let pick = [], lock = 0, moves = 0;
    return {
      _t: () => ({ cards, lock }),
      update(dt) { m.tick(dt); cards.forEach(c => c.f = lerp(c.f, c.open || c.done ? 1 : 0, dt * 10)); if (lock > 0) { lock -= dt; if (lock <= 0) { pick.forEach(c => c.open = false); pick = []; } } },
      draw() {
        m.bg('#fde3a7', '#f7c873');
        cards.forEach(c => {
          const sx = Math.abs(Math.cos(c.f * Math.PI)); const face = c.f > .5;
          ctx.save(); ctx.translate(c.x + 55, c.y + 50); ctx.scale(sx || .02, 1);
          rrect(-55, -50, 110, 100, 12); fillInk(face ? (c.done ? '#d6f5c6' : '#fff6e0') : C.red, 3);
          if (face) { item(c.id, 0, -6, 1.3, m.t); ctx.scale(1 / (sx || .02), 1); txt(L(ITEMS[c.id]), 0, 36, 12, C.ink, 'center', FONT, '700'); }
          else { drawSun(0, 0, 18, 0, {}); }
          ctx.restore();
        });
        m.chrome(L(B('चालें', 'Moves')) + ': ' + moves);
      },
      down(x, y) {
        if (m.backHit(x, y) || m.won || lock > 0) return;
        const c = cards.find(c => !c.open && !c.done && inRect(x, y, { x: c.x, y: c.y, w: 110, h: 100 })); if (!c) return;
        c.open = true; pick.push(c); Audio2.sfx('click');
        if (pick.length === 2) { moves++; if (pick[0].id === pick[1].id) { pick.forEach(p => { p.done = true; p.open = false; }); pick = []; Audio2.sfx('collect'); if (cards.every(c => c.done)) m.win(); } else lock = .9; }
      }
    };
  },

  // ---------- 5. Clean the river ghat ----------
  clean(arg, onDone, standalone) {
    const m = MiniShell(B('घाट-नदी की सफ़ाई', 'Clean the River Ghat'), B('तैरता प्लास्टिक उठाएँ — पर फूल और दीये बहने दें', 'Scoop up floating plastic — but let flowers and diyas float'), standalone, onDone);

  symbols(arg, onDone, standalone) {
    const m = MiniShell(B('पर्व के चिह्न मिलाएँ', 'Match Festival Symbols'), B('बाईं ओर नाम चुनें, फिर दाईं ओर उसका सही चिह्न', 'Pick a name on the left, then its matching symbol on the right'), standalone, onDone);

    let sel = null;
    return {
      _t: () => ({ left, right }),

        m.bg('#fff0c4', '#f7c873');

  // ---------- 8. Madhubani pattern puzzle ----------
  madhubani(arg, onDone, standalone) {
    const m = MiniShell(B('मधुबनी पहेली', 'Madhubani Pattern Puzzle'), B('हर टुकड़े पर टैप करके घुमाएँ और चित्र पूरा करें', 'Tap each tile to rotate it and complete the painting'), standalone, onDone);
    const N = 3, SZ = 330, TS = SZ / N, ox = W / 2 - SZ / 2, oy = 120;
    const art = document.createElement('canvas'); art.width = SZ; art.height = SZ;
    paintArt(art, 'puzzle');
    const tiles = []; for (let i = 0; i < N * N; i++) tiles.push({ r: [1, 2, 3, 0, 1, 3, 2, 1, 3][i], a: 0 });
    tiles.forEach(tl => tl.a = tl.r * Math.PI / 2);
    return {
      _t: () => ({ tiles, ox, oy, TS, N }),
      update(dt) { m.tick(dt); tiles.forEach(tl => tl.a = lerp(tl.a, tl.r * Math.PI / 2, dt * 12)); },
      draw() {
        m.bg('#fde3a7', '#e8a35c');
        frame(ox - 30, oy - 30, SZ + 60, SZ + 60, '#3b1d0b');
        tiles.forEach((tl, i) => { const cx = ox + (i % N) * TS + TS / 2, cy = oy + Math.floor(i / N) * TS + TS / 2; ctx.save(); ctx.translate(cx, cy); ctx.rotate(tl.a); ctx.drawImage(art, (i % N) * TS, Math.floor(i / N) * TS, TS, TS, -TS / 2, -TS / 2, TS, TS); ctx.restore(); if (!m.won) { ctx.strokeStyle = 'rgba(59,29,11,.6)'; ctx.lineWidth = 2; ctx.strokeRect(cx - TS / 2, cy - TS / 2, TS, TS); } });
        // reference
        rrect(40, 140, 170, 200, 12); fillInk('#fff6e0', 2.5); txt(L(B('मूल चित्र', 'Original')), 125, 160, 14, C.red, 'center', FONT, '800'); ctx.drawImage(art, 55, 180, 140, 140);
        m.chrome(`${tiles.filter(t => t.r % 4 === 0).length}/9`);
      },
      down(x, y) {
        if (m.backHit(x, y) || m.won) return;
        const c = Math.floor((x - ox) / TS), r = Math.floor((y - oy) / TS); if (c < 0 || r < 0 || c >= N || r >= N) return;
        const tl = tiles[r * N + c]; tl.r = (tl.r + 1); if (tl.r % 4 === 0) { tl.a -= Math.PI * 2; tl.r = 0; }
        Audio2.sfx('click'); if (tiles.every(t => t.r % 4 === 0)) m.win();
      }
    };
  },

  // ---------- Recipe (Nahay-Khay meal / Kharna kheer) ----------
  recipe(arg, onDone, standalone) {
    const kheer = arg === 'kheer';
    const m = MiniShell(kheer ? B('खरना: गुड़ की खीर और रोटी', 'Kharna: Jaggery Kheer & Roti') : B('नहाय-खाय: कद्दू-भात', 'Nahay-Khay: Kaddu-Bhaat'),

    const order = kheer ? ['milk', 'rice', 'gur'] : ['lauki', 'chana', 'rice', 'ghee'];
    const shelf = shuffle(order.slice()).map((id, i) => ({ id, x: 170 + i * 100, y: 200, used: false, shake: 0 }));

    return {
      _t: () => ({ shelf, order, added }),
      update(dt) { m.tick(dt); msgT -= dt; shelf.forEach(s => s.shake = Math.max(0, s.shake - dt)); ang += dt * stir * .3; },
      draw() {
        m.bg('#f6dcae', '#d9a066');
        rrect(110, 140, 120 + order.length * 100, 120, 12); fillInk('#a0703a', 2.5);
        shelf.forEach(s => { if (!s.used) { item(s.id, s.x + (s.shake ? Math.sin(m.t * 50) * 4 : 0), s.y, 1.4); txt(L(ITEMS[s.id]), s.x, 244, 13, '#fff', 'center', FONT, '700'); } });
        rrect(110, 290, 360, 190, 14); fillInk('#fff6e0', 2.5); txt(L(B('दादी की विधि', 'Dadi\'s recipe')), 290, 312, 18, C.red, 'center', TFONT);
        order.forEach((id, i) => txt(`${i + 1}. ${L(ITEMS[id])}` + (i < added ? '  ✔' : ''), 150, 348 + i * 28, 17, i < added ? C.green : C.ink, 'left', FONT, '700'));
        txt((added === order.length ? '✔ ' : '') + L(B('अंत में: अच्छे से हिलाएँ', 'Finally: stir well')), 150, 348 + order.length * 28, 16, C.ink, 'left', FONT, '600');
        // pot on chulha
        chulha(700, 480, 2.4, m.t);
        ctx.beginPath(); ctx.moveTo(600, 300); ctx.quadraticCurveTo(590, 390, 700, 395); ctx.quadraticCurveTo(810, 390, 800, 300); ctx.closePath(); fillInk('#8a8a8a', 3);
        ctx.beginPath(); ctx.ellipse(700, 300, 100, 26, 0, 0, Math.PI * 2); fillInk(added ? (kheer ? lerpCol('#fffaf0', '#c8955a', Math.min(1, stir / 12)) : lerpCol('#d8c890', '#b8a040', Math.min(1, stir / 12))) : '#3a3a3a', 3);
        if (added) { ctx.save(); ctx.translate(700, 300); for (let i = 0; i < added * 3; i++) { const a = ang + i * 1.3; ctx.fillStyle = kheer ? '#fff' : '#8cc63f'; ell(Math.cos(a) * 60, Math.sin(a) * 14, 5, 3); ctx.fill(); } ctx.restore(); }
        if (added === order.length) { ctx.save(); ctx.translate(700 + Math.cos(ang * 3) * 40, 290); ctx.rotate(-.5 + Math.sin(ang * 3) * .2); ctx.beginPath(); ctx.rect(-4, -90, 8, 90); fillInk('#7a4a22', 2); ctx.restore(); }
        for (let k = 0; k < 3; k++) { ctx.globalAlpha = .35; circ(680 + k * 20, 260 - ((m.t * 30 + k * 20) % 60), 8); ctx.fillStyle = '#fff'; ctx.fill(); ctx.globalAlpha = 1; }
        if (added === order.length) { rrect(560, 130, 280, 30, 12); fillInk('#fff', 2); rrect(562, 132, 276 * Math.min(1, stir / 12), 26, 10); ctx.fillStyle = '#ff9f1c'; ctx.fill(); txt(L(B('टैप करके हिलाएँ!', 'Tap to stir!')), 700, 146, 15, C.ink, 'center', FONT, '800'); }
        if (msgT > 0) txtO(msg, W / 2, 104, 22, '#fff', C.red, 'center', FONT, 5);
        m.chrome(`${added}/${order.length}`);
      },
      down(x, y) {
        if (m.backHit(x, y) || m.won) return;
        if (added < order.length) {
          const s = shelf.find(s => !s.used && Math.hypot(s.x - x, s.y - y) < 40); if (!s) return;
          if (s.id === order[added]) { s.used = true; added++; Audio2.sfx('splash'); } else { s.shake = .35; Audio2.sfx('wrong'); msg = L(B('विधि का क्रम देखें', 'Check the recipe order')); msgT = 1.4; }
        } else { stir++; Audio2.sfx('step'); if (stir >= 12) { msg = L(kheer ? B('रसियाव तैयार! सुगंध फैल गई।', 'Rasiyaw is ready — what an aroma!') : B('कद्दू-भात तैयार!', 'Kaddu-bhaat is ready!')); msgT = 2; m.win(); } }
      }
    };
  }
};

// Paints one of the collectible Madhubani artworks onto a canvas
const ART_LIST = [
  { id: 'sun', n: B('सूर्य देव', 'Surya Dev') }, { id: 'fish', n: B('मछली युगल', 'Fish Pair') }, { id: 'lotus', n: B('कमल सरोवर', 'Lotus Pond') }, { id: 'peacock', n: B('मोर', 'Peacock') },
  { id: 'tree', n: B('जीवन वृक्ष', 'Tree of Life') }, { id: 'diyas', n: B('संध्या के दीप', 'Evening Lamps') }, { id: 'chariot', n: B('सूर्य रथ', 'Sun Chariot') }, { id: 'grand', n: B('छठ घाट', 'Chhath Ghat') }
];
function paintArt(cnv, id, t = 0) {
  const prev = ctx; const c2 = cnv.getContext('2d');
  // temporarily redirect drawing to the canvas

    { l: B('दादी की आवाज़ (कथन)', 'Grandmother narration'), v: S.narr ? L(B('चालू', 'ON')) : L(B('बंद', 'OFF')), a: () => { S.narr = !S.narr; if (S.narr) narrate(L(B('नमस्ते बेटा! मैं तुम्हें छठ की कहानी सुनाऊँगी।', 'Namaste beta! I will tell you the story of Chhath.'))); else try { speechSynthesis.cancel(); } catch (e) { } } },
    { l: B('टच नियंत्रण', 'Touch controls'), v: touchUI ? L(B('दिखाएँ', 'Show')) : L(B('छिपाएँ', 'Hide')), a: () => touchUI = !touchUI },

  ];
  const rr = i => ({ x: 200, y: 92 + i * 47, w: 560, h: 40 });
  return simpleScene({

      rows().forEach((r, i) => { const q = rr(i); rrect(q.x, q.y, q.w, q.h, 10); fillInk(i % 2 ? '#fff6e0' : '#ffeec8', 1.5); txt(L(r.l), q.x + 16, q.y + 20, 16, C.ink, 'left', FONT, '700'); if (r.minus) { button({ x: q.x + 330, y: q.y + 3, w: 44, h: 34 }, '−', { size: 20 }); txt(r.v, q.x + 430, q.y + 20, 16, C.red, 'center', FONT, '800'); button({ x: q.x + 486, y: q.y + 3, w: 44, h: 34 }, '+', { size: 20 }); } else { button({ x: q.x + 300, y: q.y + 3, w: 250, h: 34 }, r.v, { size: 14 }); } });

      Audio2.applyVol(); Audio2.sfx('click'); if (S.track >= 0) Audio2.playForce(S.track); save();
    }
  });
}

      for (let i = 0; i < 5; i++) person(470 + i * 95, 470, ['vrati', 'chachi', 'kaki', 'dadi', 'maa'][i], { pose: cur >= 0 ? 'offer' : 'pray', t: t + i, s: .85, carry: (a, b) => soop(a, b, .45, true, t) });

      wrap(L(B('बाँसुरी, तबला, मंजीरा, घंटियाँ और तानपुरा — ये सभी मूल वाद्य रचनाएँ हैं, लोकधुनों से प्रेरित।', 'Bansuri, tabla, manjira, bells and tanpura drone — all original instrumental compositions inspired by folk melodies.')), 660, 200, 420, 14, '#fff', 1.4, 'center', '700');

// ---------------- VIRTUAL GHAT (sandbox) ----------------
function GhatSandbox() {
  let t = 0, sel = 'diya', drag = null, erase = false, eve = true;
  const pal = ['diya', 'kosi', 'soop', 'daura', 'kalash', 'flower', 'rangoli', 'banana', 'vrati', 'lotus'];
  const palN = { diya: ITEMS.diya, kosi: B('कोसी मंडप', 'Kosi canopy'), soop: ITEMS.soop, daura: ITEMS.daura, kalash: ITEMS.kalash, flower: ITEMS.flower, rangoli: B('रंगोली', 'Rangoli'), banana: B('केले का पौधा', 'Banana plant'), vrati: B('व्रती', 'Devotee'), lotus: B('कमल', 'Lotus') };
  const pr = i => ({ x: 10 + i * 94, y: H - 82, w: 88, h: 74 });
  const btns = { time: { x: W - 300, y: 14, w: 140, h: 40 }, erase: { x: W - 450, y: 14, w: 140, h: 40 }, clear: { x: W - 150, y: 14, w: 136, h: 40 } };
  function drawObj(o, s = 1) {
    switch (o.k) {
      case 'diya': diya(o.x, o.y, 1.2 * s, true, t); break; case 'kosi': ctx.save(); ctx.translate(o.x, o.y); ctx.scale(.8 * s, .8 * s); [-30, -10, 10, 30].forEach(a => { ctx.beginPath(); ctx.moveTo(a, 0); ctx.lineTo(0, -140); strokeInk(6, '#5c8a2a'); }); for (let i = 0; i < 6; i++) { ctx.save(); ctx.translate(0, -140); ctx.rotate(-Math.PI / 2 + (i - 2.5) * .45); ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(25, -10, 45, 6); ctx.quadraticCurveTo(25, 2, 0, 0); fillInk('#6fae3a', 1.5); ctx.restore(); } for (let i = 0; i < 5; i++) diya(-36 + i * 18, 0, .55, true, t); ctx.restore(); break;
      case 'soop': soop(o.x, o.y, .9 * s, true, t); break; case 'daura': daura(o.x, o.y, .9 * s, true, t); break; case 'kalash': kalash(o.x, o.y, 1.1 * s); break;
      case 'flower': item('flower', o.x, o.y, 1.2 * s); break; case 'rangoli': rangoli(o.x, o.y, 50 * s, t); break; case 'banana': tree(o.x, o.y, .7 * s, 'banana', t); break;
      case 'vrati': person(o.x, o.y, 'vrati', { pose: 'offer', s: .8 * s, t, carry: (a, b) => soop(a, b, .45, true, t) }); break; case 'lotus': lotus(o.x, o.y, .9 * s); break;
    }
  }
  return simpleScene({
    enter() { Audio2.play(5); Audio2.setAmb({ river: .8 }); },
    update(dt) { t += dt; },
    draw() {
      const p = eve ? PAL.sunset : PAL.dawn; drawSky(p, t, W / 2); drawHills(p, 0, t); drawRiver(330, t, p, 0, W / 2);
      ghatSteps(0, 330, W + 60, 1); ctx.fillStyle = '#d9a066'; ctx.fillRect(0, 344, W, 120); ctx.fillStyle = C.red; for (let x = 20; x < W; x += 40) { circ(x, 350, 2); ctx.fill(); }
      [...S.ghat].sort((a, b) => a.y - b.y).forEach(o => drawObj(o));
      title(L(B('मेरा घाट — अपना घाट सजाएँ', 'My Ghat — decorate your own')), 72, 22);
      button(btns.time, eve ? L(B('🌅 संध्या', '🌅 Evening')) : L(B('🌄 भोर', '🌄 Dawn')), { size: 14 });
      button(btns.erase, erase ? L(B('✖ हटाना चालू', '✖ Erase ON')) : L(B('हटाएँ', 'Erase')), { size: 14, c1: erase ? '#ffb3a7' : undefined });
      button(btns.clear, L(B('सब साफ़', 'Clear all')), { size: 14 });
      ctx.fillStyle = 'rgba(59,29,11,.85)'; ctx.fillRect(0, H - 90, W, 90);
      pal.forEach((k, i) => { const q = pr(i); rrect(q.x, q.y, q.w, q.h, 10); fillInk(k === sel && !erase ? '#ffd23f' : '#fff6e0', 2); ctx.save(); ctx.beginPath(); ctx.rect(q.x, q.y, q.w, q.h - 16); ctx.clip(); drawObj({ k, x: q.x + q.w / 2, y: q.y + (k === 'kosi' || k === 'banana' || k === 'vrati' ? 56 : k === 'rangoli' ? 30 : 38) }, k === 'kosi' || k === 'banana' || k === 'vrati' ? .4 : .6); ctx.restore(); txt(L(palN[k]), q.x + q.w / 2, q.y + q.h - 9, 11, C.ink, 'center', FONT, '700'); });
      button(backBtn(), L(B('◂ मेनू', '◂ Menu')), { size: 15 });
      if (!S.ghat.length) txtO(L(B('नीचे से कुछ चुनें और घाट पर टैप करें', 'Pick something below and tap on the ghat')), W / 2, 250, 18, '#fff', C.ink, 'center', FONT, 4);
    },
    down(x, y) {
      if (inRect(x, y, backBtn())) { save(); return go(Menu()); }
      if (inRect(x, y, btns.time)) { eve = !eve; return; } if (inRect(x, y, btns.erase)) { erase = !erase; return; } if (inRect(x, y, btns.clear)) { S.ghat = []; save(); return; }
      for (let i = 0; i < pal.length; i++) if (inRect(x, y, pr(i))) { sel = pal[i]; erase = false; Audio2.sfx('click'); return; }
      if (y > H - 90 || y < 60) return;
      const hit = [...S.ghat].reverse().find(o => Math.hypot(o.x - x, (o.y - 20) - y) < 40);
      if (hit) { if (erase) { S.ghat.splice(S.ghat.indexOf(hit), 1); Audio2.sfx('sweep'); save(); } else drag = hit; return; }
      if (!erase && S.ghat.length < 60) { S.ghat.push({ k: sel, x, y: clamp(y, 300, H - 95) }); Audio2.sfx(sel === 'diya' ? 'diya' : 'collect'); save(); }
    },
    move(x, y) { if (drag) { drag.x = x; drag.y = clamp(y, 300, H - 95); } },
    up() { if (drag) { drag = null; save(); } }
  });
}

// ================= MAIN LOOP =================
let lastT = performance.now();
function frameLoop(now) {
  const dt = Math.min(.05, (now - lastT) / 1000); lastT = now;
  ctx.setTransform(SCALE * DPR, 0, 0, SCALE * DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  try {
    if (scene) { scene.update(dt); scene.draw(); }
  } catch (e) { console.error(e); }
  for (const k in pressed) delete pressed[k];
  if (fadeDir) {
    fade += dt * 3 * fadeDir;
    if (fadeDir > 0 && fade >= 1) { fade = 1; scene = nextScene || scene || Menu(); nextScene = null; for (const k in keys) keys[k] = false; scene.enter && scene.enter(); fadeDir = -1; }
    else if (fadeDir < 0 && fade <= 0) { fade = 0; fadeDir = 0; }
  }
  if (fade > 0) { ctx.fillStyle = `rgba(30,10,0,${fade})`; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frameLoop);
}
load(); resize();
// first screen: tap to begin (unlocks audio on browsers that require a gesture)

  let t = 0;
  return simpleScene({
    update(dt) { t += dt; },
    draw() {
      const p = PAL.predawn; drawSky(p, t, 0, { noSun: true }); drawSun(W / 2, 250, 60, t, { face: true, glow: true }); drawRiver(372, t, p, 0, W / 2);
      txtO('छठ महापर्व', W / 2, 100, 48, '#ffd23f', '#5a1a05', 'center', TFONT, 8);
      txtO('Chhath Mahaparv – The Sacred Journey of Surya Dev', W / 2, 146, 18, '#fff3d6', '#5a1a05', 'center', FONT, 5);
      ctx.globalAlpha = .6 + .4 * Math.sin(t * 3); txtO(IS_TOUCH ? 'शुरू करने के लिए टैप करें · Tap to begin' : 'शुरू करने के लिए क्लिक करें या कोई कुंजी दबाएँ · Click or press any key', W / 2, 430, 20, '#fff', '#3b1d0b', 'center', FONT, 5); ctx.globalAlpha = 1;
      txt('🎧 ध्वनि के साथ खेलें · Best with sound', W / 2, 470, 14, '#ffe9b0', 'center');
    },
    down() { Audio2.unlock(); go(Menu()); },
    key() { Audio2.unlock(); go(Menu()); }
  });
}
go(Splash());
requestAnimationFrame(frameLoop);
if (window.speechSynthesis) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch (e) { }
window.__game = { go, World, MINIS, LEVELS, S, get scene() { return scene; } };
